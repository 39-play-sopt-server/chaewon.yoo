services:
  app:
    image: ${APP_IMAGE:-sopt-assignment:local}
    build: .
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    volumes:
      - type: bind
        source: ${APP_CONFIG:?Set APP_CONFIG to the absolute path of the EC2 application.yml}
        target: /app/config/application.yml
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 512m
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    depends_on:
      - app
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./deploy/nginx/compose.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/posts?page=0&size=1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
