server {
    listen 80;
    server_name sopt-ucaeon.p-e.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://sopt-ucaeon.p-e.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sopt-ucaeon.p-e.kr;

    ssl_certificate /etc/letsencrypt/live/sopt-ucaeon.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sopt-ucaeon.p-e.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $server_name;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
    }
}
